<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mindleaf</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <h1>Mindleaf</h1>
      </header>

      <section class="home-view" id="home-view">
        <button class="new-graph-button" id="new-graph-button" type="button">New branch</button>

        <section class="graphs-section" aria-labelledby="graphs-title">
          <div class="section-heading">
            <h2 id="graphs-title">My branches</h2>
            <span class="graph-count" id="graph-count">0</span>
          </div>

          <ul class="graph-list" id="graph-list"></ul>

          <p class="empty-state" id="empty-state">No graphs yet.</p>
        </section>
      </section>

      <section class="detail-view" id="detail-view" hidden>
        <div class="detail-header">
          <button class="back-button" id="back-button" type="button">Back</button>
          <div class="detail-heading">
            <h2 class="detail-title" id="detail-title">Graph</h2>
          </div>
          <button class="update-graph-button" id="update-graph-button" type="button" hidden>Update graph</button>
        </div>
        <div class="graph-visual" id="graph-visual" aria-label="Knowledge graph">
          <div class="graph-loading" id="graph-loading" hidden></div>
        </div>
        <div class="lesson-bar" id="lesson-bar" aria-label="Lesson steps"></div>
        <section class="chat-panel" aria-label="Graph chat">
          <div class="chat-messages" id="chat-messages"></div>
          <form class="chat-form" id="chat-form">
            <input class="chat-input" id="chat-input" type="text" placeholder="Ask about this page" autocomplete="off">
            <button class="chat-send" type="submit">Send</button>
          </form>
        </section>
      </section>
    </main>

    <script src="vendor/cytoscape.min.js"></script>
    <script src="graph.js"></script>
    <script src="lesson_bar.js"></script>
    <script src="sidepanel.js"></script>
  </body>
</html>
